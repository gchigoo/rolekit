schema: rolekit/task-contract@1
id: RK-20260728-DOG-LIVE
kind: implementation
role: minimal-implementer
executor: pi
objective: Create file src/dogfood-1.txt containing exactly the text dogfood-ok-1 and nothing else.
context:
  required_files:
    - src/seed.txt
  docs: []
scope:
  writable:
    - src/**
  forbidden:
    - "**/.env*"
    - package.json
constraints:
  - Only create the requested file
deliverables:
  - src/dogfood-1.txt
acceptance:
  commands:
    - run: node -e "const fs=require('fs');const t=fs.readFileSync('src/dogfood-1.txt','utf8').trim();process.exit(t==='dogfood-ok-1'?0:1)"
      expect_exit: 0
  assertions:
    - file content exact
execution:
  worktree: isolated
  max_tool_calls: 20
  network: allow
  timeout_minutes: 5
escalation:
  on_scope_change: return_blocked
  on_new_dependency: require_approval
  on_ambiguous_requirement: return_question
