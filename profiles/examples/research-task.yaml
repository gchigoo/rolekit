# Research Brief = kind=research TaskContract (compilePrompt → prompt.md → API input).
# Mechanical research assertions are post-run: npm run check:research -- .rolekit/runs/<run-id>
# Verifier acceptance.commands cannot see run-dir artifacts (cwd=worktree), so keep a no-op command.
schema: rolekit/task-contract@1
id: RK-RESEARCH-EXAMPLE
kind: research
role: researcher
executor: chatgpt-codex
objective: >-
  Research Brief template (host/human authors the brief before compile):
  - Goal: what decision or deliverable this research must support
  - Audience / usage scenario
  - Time range (e.g. last 30 days / as-of today)
  - Comparison dimensions if any
  - Source policy (preferred domains, blocked domains)
  - Delivery format (structured markdown with citations)
  Example objective for a live run: Identify this week's latest Node.js release version
  and summarize release-note highlights with citations. Prefer official nodejs.org sources.
context:
  required_files: []
  docs: []
scope:
  writable: []
  forbidden:
    - "**/.env*"
    - package.json
constraints:
  - Do not edit product code; research artifacts land under the run directory only
  - Prefer primary sources; label facts vs inferences
  - max_tool_calls for acceptance runs should be <= 20 (override in executor settings)
deliverables:
  - artifacts/report.md (produced by chatgpt-codex collect; not a worktree path)
  - artifacts/activity.json (produced by chatgpt-codex collect; not a worktree path)
acceptance:
  commands:
    - run: node -e "process.exit(0)"
      expect_exit: 0
  assertions:
    - "Post-run check: npm run check:research -- .rolekit/runs/<run-id>"
    - "Worktree git diff must be empty for research runs"
execution:
  worktree: isolated
  max_tool_calls: 20
  network: allow
  timeout_minutes: 30
escalation:
  on_scope_change: return_blocked
  on_new_dependency: require_approval
  on_ambiguous_requirement: return_question
