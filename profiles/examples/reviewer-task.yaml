schema: rolekit/task-contract@1
id: RK-PROFILE-REVIEWER-EXAMPLE
kind: review
role: reviewer
executor: pi
objective: >-
  Review the seeded change described in docs/review-subject.md and write an adversarial
  review report to docs/review-report.md. Do not edit source under src/.
context:
  required_files:
    - docs/review-subject.md
    - src/seed.txt
  docs:
    - docs/review-subject.md
scope:
  writable:
    - docs/review-report.md
  forbidden:
    - src/**
    - "**/.env*"
    - package.json
constraints:
  - Read-only against application source
  - Report must include Findings and Verdict sections
deliverables:
  - docs/review-report.md
acceptance:
  commands:
    - run: node -e "const fs=require('fs');const p='docs/review-report.md';if(!fs.existsSync(p))process.exit(1);const t=fs.readFileSync(p,'utf8');process.exit(t.trim().length>0?0:1)"
      expect_exit: 0
  assertions:
    - docs/review-report.md exists and is non-empty
execution:
  worktree: isolated
  max_tool_calls: 30
  network: allow
  timeout_minutes: 8
escalation:
  on_scope_change: return_blocked
  on_new_dependency: require_approval
  on_ambiguous_requirement: return_question
