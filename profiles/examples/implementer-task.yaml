schema: rolekit/task-contract@1
id: RK-PROFILE-IMPLEMENTER-EXAMPLE
kind: implementation
role: implementer
executor: pi
objective: Create file src/profile-implementer.txt containing exactly the text profile-implementer-ok and nothing else.
context:
  required_files:
    - src/seed.txt
  docs: []
scope:
  writable:
    - src/**
  forbidden:
    - "**/.env*"
    - package.json
constraints:
  - Only create the requested file
  - Do not modify other files
deliverables:
  - src/profile-implementer.txt
acceptance:
  commands:
    - run: node -e "const fs=require('fs');const t=fs.readFileSync('src/profile-implementer.txt','utf8').trim();process.exit(t==='profile-implementer-ok'?0:1)"
      expect_exit: 0
  assertions:
    - src/profile-implementer.txt exists with exact content profile-implementer-ok
execution:
  worktree: isolated
  max_tool_calls: 20
  network: allow
  timeout_minutes: 5
escalation:
  on_scope_change: return_blocked
  on_new_dependency: require_approval
  on_ambiguous_requirement: return_question
