- item: 实现严格前置三上游 done；verifier D9 + pi-rpc D15 4.3/4.5/4.6/4.8 + 本条 4.5/4.9 patch 全合入；当前仅 design admission
  source: 范围守护
  status: passed
- item: workitem 六子命令、gate id 路由、.rolekit/work-items/、core PolicyEngine 复用、items/roadmap 回写与 host-adapter 跟进挂载点齐全
  source: 挂载点
