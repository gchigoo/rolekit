- item: gate <id> 大小写敏感路由；WI- list/approve/reject shape 与 workitem_not_found/no_pending_gate/invalid_workitem 冻结；run- 零回归；未知前缀 exit 2；resolved同决策no-op、相反决策gate_decision_conflict
  source: 流程级约束
  status: passed
- item: lane override用RunManager.ensureAuditEvent在start前写，prepared/starting再入按WI id+ts补写去重；direct 无 run/class-(1)机械 gate且不得宣称同等保护；selectLane 与
