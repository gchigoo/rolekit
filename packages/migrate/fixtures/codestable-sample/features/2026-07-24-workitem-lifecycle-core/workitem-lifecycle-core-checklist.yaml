  source: 流程级约束
  status: passed
- item: D6 create在全局锁内扫描/分配/校验/写且双进程id唯一；使用wx锁 + stale 删除后重试一次 + 候选校验 + 同目录原子替换；失败保留旧文件，仍冲突 lock_held exit 1
  source: 流程级约束
  status: passed
- item: v1 只在 WorkItem 层接入 ADR 003 设计/最终验收 gate；question 仅修订 task 重试，reject/run blocked 后须新建 WorkItem；无手改 YAML 恢复、通用 executing gate 或 blocked
