dod:
  commands:
  - id: CMD-001
    command: npm test
    core: true
    failure_handling: fix-or-block
  - id: CMD-002
    command: node --test test/e2e/
    core: true
    failure_handling: fix-or-block
  - id: CMD-003
    command: npx tsc --noEmit && npx biome check .
    core: true
    failure_handling: fix-or-block
  - id: CMD-004
    command: rolekit validate <artifact>
    core: true
    failure_handling: fix-or-block
  evidence_required:
  - command_output
  - run_artifacts
  - workitem_yaml
  - events
  - gate_log
  - diff_summary
  - roadmap_patch
  cleanliness:
    core_io: forbidden
    cli_rule_duplication: forbidden
    debug_output: forbidden
    todo_fixme: forbidden
