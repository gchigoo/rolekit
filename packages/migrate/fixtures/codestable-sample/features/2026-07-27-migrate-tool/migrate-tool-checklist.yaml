steps:
- action: source safety/manifest + SourceAdapter contract
  exit_signal: path/symlink/size/UTF-8/version/license负例与RFC8785 before-manifest golden全绿，源脚本零执行
  status: done
- action: CodeStable mapper：必迁entity、精确状态表、ADR/compound/attention
  exit_signal: 状态与category/key/title/created fixtures过；attention ordinal/重复H2、KN缺字段、unknown/missing/type-missing均失败
  status: done
- action: roadmap-feature plan：locator、merge、goal depends、DAG、封闭skip
  exit_signal: 八步map；decisions；mandatory exact counts/source-digest；depends bound改写；multibind item+feature error；skip/error/DAG全绿
  status: done
- action: Superpowers 5.1.3 adapter：14技能静态映射、8 heading/templates、资产台账、MIT
  exit_signal: 8 profile canonical YAML/raw sha+fragment attribution；6 note tags/body/说明；discarded单落点；14双射、禁词/license全绿
  status: done
- action: fresh-target staging promoter：全量validate、source-after、directory rename与receipt
  exit_signal: bundle envelope/counts/raw sha全绿；no-op五identity+三digest，tamper拒绝；error plan不取锁；故障零target
  status: done
- action: migrate CLI/report：audit-only/apply、flags、JSON/exit、稳定码
  exit_signal: report/target三态；plan-error omit|audit、后期失败staging指针；issues两hash链/message_code稳定；usage/business e2e全绿
  status: done
- action: roadmap两条主验收：本仓库CodeStable self-migration + Superpowers sample
  exit_signal: 两源fresh apply全target validate、deterministic semantic diff、source checksum通过
  status: done
- action: harden/收口：Windows crash/source-change/security矩阵 + D14 dry-run patch
  exit_signal: fault矩阵与全命令绿；roadmap/upstream/host/items补丁逐项有diff且旧契约零丢失
  status: done
