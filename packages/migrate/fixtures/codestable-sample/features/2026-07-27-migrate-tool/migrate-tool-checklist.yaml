dod:
  commands:
  - id: CMD-001
    command: npm test
    core: true
    failure_handling: fix-or-block
  - id: CMD-002
    command: npx tsc --noEmit
    core: true
    failure_handling: fix-or-block
  - id: CMD-003
    command: npx biome check .
    core: true
    failure_handling: fix-or-block
  - id: CMD-004
    command: node --test test/e2e/
    core: true
    failure_handling: fix-or-block
  - id: CMD-005
    command: npm run validate:migrations
    core: true
    failure_handling: fix-or-block
  evidence_required:
  - command_output
  - migration_reports
  - source_manifest
  - target_manifest
  - mapping
  - semantic_diff
  - receipt
  - zero_target_diff
  - windows_crash
  - superpowers_matrix
  - license_attribution
  - roadmap_patch
  cleanliness:
    source_scripts_executed: forbidden
    absolute_paths_in_receipt: forbidden
    debug_output: forbidden
    todo_fixme: forbidden
    commented_code: forbidden
    unused_imports: forbidden
    fixtures_in_repo_root: forbidden
