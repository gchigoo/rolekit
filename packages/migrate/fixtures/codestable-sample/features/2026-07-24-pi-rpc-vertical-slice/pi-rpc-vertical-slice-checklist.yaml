steps:
  - action: "loaders+Mock+reservation/run-state/API：RFC8785 digest（含升序 knowledge_rules/空[]）、knowledgeSnapshot 齐套、executor-control、prepare/retry/abort/phase crash"
    exit_signal: "唯一run/process；digest golden与allocation修复；starting receipt/abort/Context恢复；控制证据合法；空/非空 rules digest golden；reservation-only loader 三码不追加写"
    status: done
  - action: "WorktreeManager + MinimalVerifier + IntegrationManager：scope/基线、binary patch、apply gate、失败 digest rollback"
    exit_signal: "越界/并发变更不集成；成功 diff 落主区未提交；apply 失败主区 digest 零变化且 Envelope failed；orphan 不改终态"
    status: done
  - action: "CLI+RunSupervisor+verify e2e（detach deadline/kill懒补、九phase投影、reverify、errors/inconsistent）"
    exit_signal: "supervisor/timeout、JSON/nullable last_event_ts、phase恢复、verify以baseline+patch临时重建且原证据/主区冻结、fail-closed全绿"
    status: done
  - action: "PiRpcExecutor：probe 版本窗口 + spawn + 最小 prompt 往返 + 一次 cancel 终止 smoke（timebox 5 工作日，机械 fallback 条件见 design D2）"
    exit_signal: "阶段验收 2：Windows 真机 smoke 通过（probe 输出 + >=1 条 message 事件 + cancel 终止留存）；若触发 fallback 则须完成 roadmap update + ADR + S5-S7/Matrix 修订 + design 复审 passed 后本步才可标 done"
    status: done
  - action: "事件+collect/finalizing/cancel/timeout/lost：report-vs-intent竞态与Integration checkpoints"
    exit_signal: "commit唯一胜者；finalizing不可cancel；无cancelled+已集成；恰一finished且状态一致"
    status: done
  - action: "越界与主区注入端到端（真实 Pi）"
    exit_signal: "阶段验收 3：两注入场景 Envelope failed、verification.json 记 scope_violations、events 含 gate(block) 审计"
    status: done
  - action: "dogfood 收口：真实项目同一契约连续 2 次成功 + 1 次人工 cancel"
    exit_signal: "阶段验收 4：五件产物齐全、rolekit verify 复跑一致（仅对 2 次成功 run；cancelled run 拒绝复跑）、cancel run 的 Envelope status=cancelled 且产物形态按 D10"
    status: done

