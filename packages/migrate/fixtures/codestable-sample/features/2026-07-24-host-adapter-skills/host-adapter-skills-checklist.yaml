feature: 2026-07-24-host-adapter-skills
created: 2026-07-24

steps:
  - action: "adapters/ 骨架 + command-map.md（可用区按 D6 冻结：validate/task create|compile/run start|status|cancel|collect/verify）+ build.mjs + lint-adapters.mjs + check-delegated-run.mjs"
    exit_signal: "npm run lint:adapters 四断言（正选模式/行数/禁词/零 diff）对生成产物全绿 + check:delegation 对 fixture 会话 1 正例 + 2 负例（命令超可用区/缺 Skill 加载证据）判定正确且断言进 npm test"
    status: done
  - action: "pi SKILL.md 宿主片段 + 生成 + 安装到 owner Pi 环境 + 真实委派 run"
    exit_signal: "Pi 宿主委派 run 证据三件套：五件产物全过 rolekit validate + check:delegation 通过 + skill sha256/git rev 对照归档"
    status: done
  - action: "cursor SKILL.md 宿主片段 + 生成 + 安装 + 真实委派 run"
    exit_signal: "Cursor 宿主委派 run 证据三件套同口径齐全"
    status: done
  - action: "codex 入口产物 + README（落位路径实现期核实）"
    exit_signal: "codex 产物过 lint 四断言 + 核实日期已写入 README（不要求委派 run，D2）"
    status: done
  - action: "收口：两宿主证据归档 + items.yaml 回写"
    exit_signal: "Goal Coverage Matrix 行'2 宿主各 >=1 次委派'证据齐全（run artifacts + skill diff/hash 两类均在）"
    status: done

checks:
  - item: "Skill 内容仅四类：何时使用/命令映射/产物读取位置/升级路径（D3 红线）"
    source: 名词契约
    status: passed
  - item: "正选模式断言：产物命令行必须匹配 rolekit <D6 可用区> + flag 白名单（全局 --json；run start 另允 --detach，其余 flag 失败），禁 node/npx/绝对路径/curl 等其他调用形态（约束对象=宿主产物；README 受禁词约束且命令行仅复制/安装类）"
    source: 名词契约
    status: passed
  - item: "禁词表初值按 D3 冻结（awaiting-gate/transition/state machine/状态机/状态转移/lane/gate 决策/escalation/compilePrompt/prompt 拼装/GatePolicy），英文词词界匹配，扩充走 code review"
    source: 名词契约
    status: passed
  - item: "三份产物由 build.mjs 从 command-map 可用区生成；规划中命令不进任何宿主产物（lint 断言）；手改产物触发零 diff 断言失败"
    source: 编排骨架
    status: passed
  - item: "可用区枚举与 D6 冻结一致；steer/workitem/migrate 留规划中并标注归属；命令映射默认教 --json"
    source: 流程级约束
    status: passed
  - item: "Skill 不指导宿主直接读写 .rolekit/ 内部文件（只读五件产物 + CLI 查询）"
    source: 流程级约束
    status: passed
  - item: "验收锚定 pi + cursor 两宿主；codex 交付但不计验收（D2）"
    source: 验收场景
    status: passed
  - item: "委派 run 证据三件套（D5）：产物 validate + check:delegation（Skill 加载证据/命令 ⊆ 可用区含 flag 白名单/error 后行为）+ skill 版本绑定（install-skill 后立即委派、期间不改 adapters/，归档 git rev + sha256）"
    source: 验收场景
    status: passed
  - item: "check:delegation 自身可证伪：fixture 1 正例 + 2 负例判定正确，断言以单测进 npm test（CI 回归门闩）"
    source: 验收场景
    status: passed
  - item: "行数上限=生成后全文 <=200 行（含 frontmatter 与空行）"
    source: 验收场景
    status: passed
  - item: "无新增 CLI 子命令（cli 包零 diff）；无 MCP 文件；无 symlink/自动安装检测"
    source: 范围守护
    status: passed
  - item: "adapters/ 入 lint 范围、package.json scripts（lint:adapters/check:delegation/install-skill:*/build:adapters）、CI 矩阵追加 lint:adapters、items.yaml 回写挂载点齐全"
    source: 挂载点
    status: passed

dod:
  commands:
    - id: CMD-001
      command: "npm run lint:adapters"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "npx biome check ."
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "node scripts/validate-adapter-artifact.ts"
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "node scripts/check-delegation-live.ts"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, run_artifacts, diff_summary]
  cleanliness:
    todo_fixme_in_skill: forbidden
    run_internal_details_in_skill: forbidden
    debug_output: forbidden
