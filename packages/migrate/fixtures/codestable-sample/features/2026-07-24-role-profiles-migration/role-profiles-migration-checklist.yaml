feature: 2026-07-24-role-profiles-migration
created: 2026-07-24

steps:
  - action: "profiles/ 骨架 + 编译五锚点契约确认（上游未输出锚点则 core 补充，D4）+ implementer 先行转换（backend+frontend 三片段合并，D1/D2/D3）"
    exit_signal: "implementer 过 rolekit validate + 编译五锚点断言绿（spike 最难合并场景）"
    status: done
  - action: "其余 5 份源转换（coordinator/analyst/architect/qa/reviewer，coordinator 按 D3 编排剥离规则）+ fragments 路径解析负例断言"
    exit_signal: "6 份全过 validate + 编译断言；路径解析负例（缺片段文件 -> 编译报错）绿"
    status: done
  - action: "researcher 原生撰写（参考素材冻结：delivery-context-recon + deepsearch讨论.md，只读）+ profiles/examples/ 三份契约模板"
    exit_signal: "7 份全过 validate + 编译断言；三模板过 rolekit validate"
    status: done
  - action: "MIGRATION.md 转换报告 + 清洁度 lint（源专有引用 grep）"
    exit_signal: "报告覆盖 7 份（源文件/章节字段对照含变体/丢弃与编排剥离记录/implementer 冲突条款表/researcher 素材清单）且 grep 零命中"
    status: done
  - action: "implementer 真实 run（kind=implementation，examples 模板实例化，Pi 真机）"
    exit_signal: "acceptance >=1 条断言命令 exit 0；run 完成、五件产物全过 rolekit validate"
    status: done
  - action: "reviewer + researcher 真实 run（kind=review / kind=research，D5 冻结 deliverable 与断言）"
    exit_signal: "reviewer: docs/review-report.md 存在+非空断言过；researcher: docs/research-notes.md 存在+非空断言过且无 citation/activity.json 断言；两 run 五件产物全过 validate"
    status: done
  - action: "收口：证据归档 + items.yaml 回写"
    exit_signal: "Goal Coverage Matrix 行'7 profile 全过校验可编译；3 角色各 >=1 次真实 run'证据齐全"
    status: done

