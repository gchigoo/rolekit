    source: 名词契约
    status: passed
  - item: "提炼规则按 D3 源真实标题：Responsibilities->capabilities、Non-responsibilities->boundaries、Output contract->deliverables、Quality gates->verification；身份锚定+Mission->片段开头；Inputs/Workflow/SuperClaude 技术行为/Completion and escalation->片段正文"
    source: 名词契约
    status: passed
  - item: "丢弃规则：frontmatter tools + Tools and permissions 章节 + model + 能力装配章节（delivery-* 技能名清单，改写须去技能名）；编排/路由/lane/角色调用链条目剥离或改写为非编排边界，逐条记 MIGRATION.md"
    source: 名词契约
    status: passed
  - item: "目录布局按 D2：profiles/roles + fragments + examples；prompt_fragments 相对 profiles/ 路径；库产物与 .rolekit/profiles 消费关系按 D6a"
    source: 名词契约
    status: passed
  - item: "minimal-implementer fixture 留 test/ 下不移动不改名，与 implementer profile 隔离"
    source: 名词契约
    status: passed
  - item: "转换为一次性人工工作，每份完成即跑 validate + 编译断言不积压"
    source: 流程级约束
    status: passed
  - item: "编译断言用五个稳定注释锚（rolekit:section:safety|role|task|acceptance|escalation）存在且顺序正确（D4）"
    source: 验收场景
    status: passed
  - item: "三 run 契约用 examples 模板实例化且 deliverable/acceptance 按 D5 冻结；researcher run 无检索/citation 断言"
    source: 验收场景
    status: passed
  - item: "清洁度：fragments 无 role_agent/agentScope/delivery-* 源专有引用（grep 断言；MIGRATION.md 引用参考素材不受此限）"
    source: 验收场景
    status: passed
  - item: "无 schema 字段新增（core diff 零 schema 变更）；字段不够用走 roadmap update 不私扩"
    source: 范围守护
    status: passed
  - item: "源仓库 pi-delivery-rolekit 全程只读；归档动作不在本条"
    source: 范围守护
    status: passed
  - item: "profiles/ 入检查范围、CI 追加 npm run validate:profiles、core 测试新增编译断言、items.yaml 回写挂载点齐全"
    source: 挂载点
    status: passed

dod:
  commands:
    - id: CMD-001
      command: "npm run validate:profiles"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "npm test"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "npx tsc --noEmit && npx biome check ."
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "npm run validate:profile-runs"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, run_artifacts, diff_summary]
  cleanliness:
    source_specific_references: forbidden
    todo_fixme: forbidden
    schema_field_additions: forbidden
