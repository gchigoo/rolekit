    raw_campaign_in_git: forbidden
    campaign_identity_or_hold_rewrite: forbidden
    secrets_or_absolute_paths_in_reports: forbidden
    pending_steering_or_gates: forbidden
    production_fault_hooks: forbidden
    debug_output: forbidden
    todo_fixme: forbidden
    commented_code: forbidden
    unused_imports: forbidden
