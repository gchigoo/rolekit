dod:
  commands:
  - id: CMD-001
    command: npm test
    core: true
    failure_handling: fix-or-block
  - id: CMD-002
    command: node --test test/e2e/
    core: true
    failure_handling: fix-or-block
  - id: CMD-003
    command: npx tsc --noEmit && npx biome check .
    core: true
    failure_handling: fix-or-block
  - id: CMD-004
    command: npm run evals
    core: true
    failure_handling: fix-or-block
  - id: CMD-005
    command: npm run lint:adapters
    core: true
    failure_handling: fix-or-block
  - id: CMD-006
    command: npm run audit:dogfood -- --campaign-root <path> --campaign <id>
    core: true
    failure_handling: fix-or-block
  - id: CMD-007
    command: npm run check:switch -- --campaign-root <path> --campaign <id>
    core: true
    failure_handling: fix-or-block
  - id: CMD-008
    command: cd <ctxline-snapshot> && cargo fmt --check && cargo test --locked && cargo build --release --locked
    core: true
    failure_handling: fix-or-block
  - id: CMD-009
    command: cd <ctxline-snapshot> && python scripts/smoke.py <binary>
    core: true
    failure_handling: fix-or-block
  - id: CMD-010
    command: npm run check:research -- <RK-06-runDir>
    core: true
    failure_handling: fix-or-block
  evidence_required:
  - command_output
  - steering_controls
  - recovery_matrix
  - error_catalog
  - integrity_fixtures
  - dogfood_plan
  - steer_nonce_source_digest
  - runtime_bundle
  - runtime_overlay_manifests
  - resolution_log
  - resolved_plan
  - campaign_started
  - campaign_sealed
  - scope_hold_if_any
  - source_manifests
  - bootstrap_log
  - live_evidence_receipts
  - local_evidence_commits
  - candidate_build_receipts
  - candidate_start_invocation_pairs
  - candidate_invocation_pairs
  - run_content_manifests
  - review_input_bundle
  - campaign_evaluation
  - campaign_artifacts_receipt
  - raw_ledger
  - metrics
  - all_run_digests
  - research_check_output
  - migration_bundle
  - ctxline_patch
  - ctxline_review
  - adapter_diff
  - switch_decision
  - roadmap_patch
