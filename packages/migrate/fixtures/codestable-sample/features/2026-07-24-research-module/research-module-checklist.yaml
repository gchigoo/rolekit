    形态 + index 编码基准实证
  exit_signal: 脱敏 spike 证据落盘（>=1 检索调用 + >=1 annotation 的响应样本 + 编码基准结论）；失败或 timebox 到期走 D1 blocking gate（路线改道须重过 design review）
  status: done
- action: OpenAiResponsesExecutor 保留（probe missing_api_key / MockResponses 单测全绿）+ ChatgptCodexExecutor + chatgpt-auth（probe missing_chatgpt_auth
    / refresh / SSE drain / cancel abort / timeout + steer unsupported）+ Mock SSE 单测
  exit_signal: 双 adapter 单测全绿，含 failed/timeout/cancelled 三终态产物形态断言；互不静默降级
  status: done
- action: 产物装配复用 artifacts helper：report.md + activity.json + ExecutorReport.evidence（D7a）+ 注册表 chatgpt-codex + research-task.yaml 指向 chatgpt-codex
    + chatgpt-codex.yaml / openai-responses.yaml 过 validate
  exit_signal: mock 链路产物齐全，Envelope 过 validate，completed evidence 恰两项，三样例过 rolekit validate
  status: done
- action: check:research 四断言脚本正负 fixture 保持语义不变且全绿（不因订阅改道弱化）
  exit_signal: 正负 fixture 断言全绿
  status: done
- action: cancel + timeout e2e（mock SSE abort -> finished(cancelled) + D7a cancelled；timeout -> abort + finished(failed, reason:timeout) + D7a
    failed）
  exit_signal: e2e 绿灯过
  status: done
- action: 真实验收 run：kind=research + executor=chatgpt-codex（时效性题目、max_tool_calls<=20）真实 SSE 执行
  exit_signal: roadmap 四断言 npm run check:research 全过 + 产物过 validate + worktree diff 空 + events 含 tool_call/message(system)/finished + token/API
    key 脱敏 grep 零命中
  status: done
- action: 收口：items.yaml 回写 + attention 凭证节 + 路线决策与 citation 经验回写 compound
  exit_signal: 回写 diff 落盘；Goal Coverage Matrix'kind=research 契约 run 四断言全过'行证据齐全
  status: done
