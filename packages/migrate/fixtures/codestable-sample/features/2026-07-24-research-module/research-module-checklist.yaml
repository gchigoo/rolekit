dod:
  commands:
  - id: CMD-001
    command: npm test
    core: true
    failure_handling: fix-or-block
  - id: CMD-002
    command: node --test test/e2e/
    core: true
    failure_handling: fix-or-block
  - id: CMD-003
    command: npx tsc --noEmit && npx biome check .
    core: true
    failure_handling: fix-or-block
  - id: CMD-004
    command: npm run check:research -- <runDir>
    core: true
    failure_handling: fix-or-block
  - id: CMD-005
    command: rolekit validate <artifact>
    core: true
    failure_handling: fix-or-block
  evidence_required:
  - command_output
  - run_artifacts
  - diff_summary
  cleanliness:
    reference_code_copy: forbidden
    api_key_in_artifacts: forbidden
    chatgpt_token_in_artifacts: forbidden
    debug_output: forbidden
    todo_fixme: forbidden
