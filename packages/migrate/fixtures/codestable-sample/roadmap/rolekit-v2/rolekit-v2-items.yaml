roadmap: rolekit-v2
created: 2026-07-24

items:
  - slug: contract-schemas
    description: TypeBox 定义 9 类 schema（TaskContract/ResultEnvelope/ExecutorReport/RunEvent/GatePolicy/RoleProfile/ExecutorProfile/WorkItem/KnowledgeEntry）并导出 JSON Schema，rolekit validate 对每类 schema 至少 1 正例 + 2 负例 fixture 判定正确
    depends_on: []
    status: done
    feature: 2026-07-24-contract-schemas
    minimal_loop: false
    notes: 同时确定 npm scope、lint 工具、CI 命令矩阵（test/typecheck/lint/CLI e2e/Windows smoke）与 Node/Pi 版本支持矩阵

  - slug: pi-rpc-vertical-slice
    description: PiRpcExecutor（capabilities 声明 start/status/cancel/collect，steer 调用返回 unsupported_operation）+ 隔离 worktree + MinimalVerifier（exit code + scope diff + 主工作区基线检查）+ rolekit run 命令 + runs 落盘，四阶段验收（MockExecutor 单测 / Pi RPC smoke / 越界与主区注入均被拦截 / 真实 dogfood 连续 2 次成功 + 1 次 cancel）
    depends_on: [contract-schemas]
    status: done
    feature: 2026-07-24-pi-rpc-vertical-slice
    minimal_loop: true
    notes: 依赖理由：消费 schema/compileTask。联合修订：共用 loaders；RunManager完整API；reservation+prepare/abort/start/wait；RunSupervisor deadline；finalizing/cancel commit互斥；可恢复binary IntegrationManager；D13 Envelope；run start 增 --retry。四阶段证据外补 reservation/abort/crash、D13、binary apply回滚、finalizer×cancel、detach×timeout。实现前须复审 passed + D15 4.3/4.5/4.6/4.8 patch 合入

  - slug: host-adapter-skills
    description: pi/codex/cursor 三份薄 Skill 入口，至少 2 宿主各完成大于等于 1 次经 Skill 驱动 CLI 的委派 run
    depends_on: [pi-rpc-vertical-slice]
    status: done
    feature: 2026-07-24-host-adapter-skills
    minimal_loop: false
    notes: 依赖理由：需要可用的 run 命令面。Skill 不承载工作流语义（ADR 001）

  - slug: role-profiles-migration
    description: pi-delivery-rolekit 7 角色转 RoleProfile YAML 与 prompt 片段，7 份全过 schema 校验并可编译 prompt，implementer/reviewer/researcher 3 份各完成大于等于 1 次真实链路 run
    depends_on: [pi-rpc-vertical-slice]
    status: done
    feature: 2026-07-24-role-profiles-migration
    minimal_loop: false
    notes: 依赖理由：3 角色真实 run 验收需要链路可用。源仓库原地保留，吸收完归档。映射策略（design D1 冻结）：非 1:1——backend+frontend 合并为 implementer、researcher 为原生新作补第 7 席，6 转换 + 1 新作 = 7 份

  - slug: verifier-gate-engine
    description: 吸收 veritack 判据设计（Run/Context/Check/Gate/Record 五原语、TriggerPolicy 四级语义 ignore/observe/confirm/block、revision 闭合、证据记账）改良为 RoleKit 原生 verifier + gate 引擎（含 GatePolicy trigger->action 引擎），不依赖 veritack 包、不 fork（ADR 006）；design 阶段产出吸收清单（借/不借/改良点，owner 过目）；验收：1 次合规 run 全程 0 人工 gate 且留 observe 审计，1 次注入越界的 run 集成前被 block
    depends_on: [pi-rpc-vertical-slice]
    status: done
    feature: 2026-07-24-verifier-gate-engine
    minimal_loop: false
    notes: 所属模块 core+runner+cli。挂载：PolicyEngine+gate-record@1、detectors/pipeline/RunManager coordinator、gate list|approve|reject、detect/policy 样例、absorption-inventory。D9 patch 已合入 §2/§3/§5/4.1/4.5/4.6/4.8/Matrix。host-adapter-skills 增补 gate 命令为 acceptance 后跟进项

  - slug: research-module
    description: RoleKit 原生深度研究模块（参考 deepsearch讨论.md 工作流与 pi-web-fetch 检索层，均只读参考）：researcher RoleProfile + kind=research 契约特化 + 研究执行路线（openai-responses 后台 ExecutorAdapter 或 Pi 会话+web 工具，design 阶段定）；契约衔接冻结不新增 schema：进度复用既有 RunEvent 类型、adapter 名走注册表、产物固定 runs/<id>/artifacts/report.md 与 activity.json 且 evidence 仅存路径；验收由断言脚本机械判定：两产物存在且入 evidence、report.md 内联引用均解析出 url+title、引用索引与 activity.json annotations 一一对应、activity.json 含检索调用记录并过结构断言
    depends_on: [role-profiles-migration]
    status: done
    feature: 2026-07-24-research-module
    minimal_loop: false
    notes: 依赖理由：需要 researcher profile 机制与链路。执行路线 design D1 已拍板 openai-responses 后台 adapter（citation annotations 是机械验收硬前提；fallback 为 blocking gate）。accepted commit 48cbdea；compound 已写 research-module-route-citation.md

  - slug: evals-fixtures
    description: 契约完整率/写入越界率/Envelope 完整率 fixture，npm run evals 一键回归，种子场景取自垂直链路验收 run 真实产物
    depends_on: [pi-rpc-vertical-slice]
    status: done
    feature: 2026-07-24-evals-fixtures
    minimal_loop: false
    notes: 依赖理由：种子场景消费真实 run 产物。evaluateRun 为与 hardening 条目 11 共享的判定函数（单一事实源）

  - slug: workitem-lifecycle-core
    description: 按 roadmap 4.9 冻结契约实现 WorkItem + 状态机 + lane 路由 + rolekit workitem 命令，create->next->start（委派一次真实 run）->done 全程命令化，非法转移 exit 1
    depends_on: [pi-rpc-vertical-slice, verifier-gate-engine]
    status: done
    feature: 2026-07-24-workitem-lifecycle-core
    minimal_loop: false
    notes: 依赖理由：pi-rpc 提供 loaders+prepare/abort/start/wait/collect+run-state/D13；verifier 提供 PolicyEvaluation+router。impl：core transition/attach/adopt/selectLane + CLI store/六子命令 + WI- gate；D4/D5/D13/saga/CAS；host-adapter 已登记 workitem+WI gate 命令表；accepted

  - slug: knowledge-layer
    description: 按 roadmap 4.10 冻结格式实现 KnowledgeEntry 四类（rule/adr/learning/note）读写与检索；rule 注入编译 prompt 断言过、四类条目各 1 正例 + 1 负例过 rolekit validate（adr 四节标题断言、rule 单段断言）、检索按 type/tags/status 过滤正确
    depends_on: [workitem-lifecycle-core]
    status: done
    feature: 2026-07-24-knowledge-layer
    minimal_loop: false
    notes: 所属模块 core+cli+runner(read-only)。依赖理由：依赖 workitem 落盘/锁先例与同级 `.rolekit` 约定；v1 无 WorkItem FK/状态联动。设计冻结 core pure catalog + CLI 单写 store + runner active-rule snapshot。验证入口：mock run prompt+knowledge-snapshot、knowledge search e2e、validate 四类正负。D8 全量 patch 与实现同批合入。

  - slug: migrate-tool
    description: mandatory类别全行，semantic entity 必有 migrate/merge/封闭skip/error 记账，禁止整类漏扫/静默成功；rolekit migrate --from codestable|superpowers；features/issues/refactors->WorkItem 对应 kind、goals 与 roadmap 主文档->WorkItem kind=goal、adrs->KnowledgeEntry type=adr 保留 Nygard 四节、compound->KnowledgeEntry 按 doc_type 机械分派 learning|note、attention->KnowledgeEntry type=rule、roadmap items->goal 的依赖集；源状态映射表冻结且未知状态迁移失败 exit 1；去重合并（feature 目录名主键，已绑定 feature 的 roadmap item 合并同一 WorkItem）；roadmap-item mapping 固定 source_locator 且 apply 的 merge/materialize 均写最终 target_id，logical key/ID/fingerprint、RFC8785原始字节与KN metadata冻结；skip 原因集合封闭且落理由计数；语义保真断言 + 抽样 diff 复核；产物 rolekit validate 全过；源目录只读；superpowers 样例包同等审计与转换
    depends_on: [workitem-lifecycle-core, knowledge-layer]
    status: done
    feature: 2026-07-27-migrate-tool
    minimal_loop: false
    notes: 依赖理由：复用4.9/4.10目标与校验。fresh-target staging+rename；CodeStable support仅provenance；canonical mapping/key/ID与KN metadata冻结；roadmap-item含locator+apply target_id；Superpowers 5.1.3/MIT/14=8 profiles+6 notes；实现门禁=workitem+knowledge done及D14全量合入

  - slug: hardening-dogfood-switchover
    description: 收口Pi steer/recovery/error/audit；固定rolekit-self+ctxline共10个delegated真实WorkItem，strict evaluation/ledger/metrics纳入全部attempt并调用evaluateRun无meta，Contract/Envelope/Integrity均100%、全attempt scope违规0（任一命中永久hold）、人工confirm仅白名单，g00..g07 candidate及每run start invocation可证；RK-01/RK-04双7-file receipts（RK-04由g03执行3min/300s wait、deadline前60s杀owner、deadline-past loss+30min variant retry）与RK-03/RK-05两次nonce accepted（RK-05机械delivery）均机读通过；RK-06固定chatgpt-codex（保留openai-responses第二实现、互不静默降级）且最终run过check:research；RK-07绑定迁移所得自身roadmap WorkItem并done；SwitchDecision必须go，hold不算完成
    depends_on: [host-adapter-skills, role-profiles-migration, verifier-gate-engine, research-module, evals-fixtures, migrate-tool]
    status: done
    feature: 2026-07-27-hardening-dogfood-switchover
    minimal_loop: false
    notes: SwitchDecision=go（eval 36be17fc…）；r3 PASSED；acceptance 2026-07-29；cutover 已授权执行 2026-07-31
