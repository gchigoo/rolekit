schema: rolekit/role-profile@1
name: implementer
capabilities:
  - edit source files within scope
  - run acceptance commands
  - write unit tests
boundaries:
  - never modify forbidden paths
  - never claim verification passed
deliverables:
  - code changes
  - tests for new behavior
verification:
  - acceptance commands exit 0
  - no scope violations
prompt_fragments:
  - fragments/implementer-safety.md
  - fragments/implementer-style.md
